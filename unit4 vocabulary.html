<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 4｜三關聽音拼字</title><style>
:root{font-family:Arial,"Microsoft JhengHei",sans-serif;color:#20364c;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:25px auto;padding:15px}h1{font-size:25px;margin:8px 0}.muted{color:#60788c;font-size:14px;line-height:1.7}.card{background:#fff;border:1px solid #dce6ef;border-radius:19px;padding:25px;box-shadow:0 7px 26px #19334a10}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 17px}.pill{border:1px solid #c7d8e5;border-radius:11px;background:#f4f8fb;color:#244a60;padding:12px 15px;cursor:pointer;font-size:15px}.pill.active{background:#216e85;color:white;border-color:#216e85}button{font:inherit;cursor:pointer}.main{background:#216e85;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:bold}.secondary{background:#eef5f9;color:#24627b;border:1px solid #c7d8e5;border-radius:10px;padding:12px 18px}.main:disabled,.secondary:disabled{opacity:.5;cursor:default}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:#597085;font-size:14px}.meaning{text-align:center;font-size:25px;margin:25px 0 5px}.hint{text-align:center;color:#6d8190;font-size:14px;margin:8px 0 18px}.center{text-align:center}.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:26px 0;max-width:100%}.tile{width:42px;height:56px;border:1px solid #cbd9e4;border-radius:9px;background:#eaf0f5;display:flex;justify-content:center;align-items:center;font:26px 'Times New Roman',serif}.tile input{display:block;width:100%;height:100%;background:#fff9e9;border:1px solid #7fb3c4;border-radius:8px;text-align:center;outline:none;font:26px 'Times New Roman',serif;color:#1e3446;padding:0}.tile input:focus{box-shadow:0 0 0 2px #5ba5bb}.tile input:disabled{color:#173e2b}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.feedback{text-align:center;min-height:55px;line-height:1.8;margin-top:15px;font-size:16px}.status{background:#f3f8fa;border-radius:9px;padding:10px 14px;margin:13px 0;font-size:14px;color:#48677a}.hide{display:none}.summary{text-align:center;padding:25px 0}.summary h2{color:#216e85}.footer{font-size:13px;color:#63788a;margin-top:24px;line-height:1.8}@media(max-width:550px){.card{padding:16px}.tile{width:31px;height:43px;font-size:21px}.tile input{font-size:21px}.meaning{font-size:22px}.pill{padding:10px}}
</style></head><body><main class="wrap"><h1>Unit 4｜聽音拼字練習</h1><p class="muted">依課本 Unit 4（第 94–98 頁）編製：25 個主單字＋7 個延伸字，共 32 字。每部分 16 字，三關可獨立練習。</p><section class="card"><div><strong>選擇單字範圍</strong><div class="controls" id="parts"><button class="pill active" data-part="0">第一部分｜1–16</button><button class="pill" data-part="1">第二部分｜17–32</button></div></div><div><strong>選擇練習關卡</strong><div class="controls" id="modes"><button class="pill active" data-mode="1">第一關｜填母音</button><button class="pill" data-mode="2">第二關｜填子音</button><button class="pill" data-mode="3">第三關｜完整拼字</button></div></div><div class="status" id="status">選擇範圍與關卡後，按「開始練習」。</div><div class="center" id="startarea"><button class="main" id="start">開始練習</button></div><div id="quiz" class="hide"><div class="top"><span id="counter"></span><span id="round"></span></div><div class="meaning" id="meaning"></div><div class="hint">請先聽單字發音，再填入缺少的字母</div><div class="actions"><button class="secondary" id="speak">🔊 聽單字發音</button></div><div class="tiles" id="tiles"></div><div class="actions"><button class="main" id="check">檢查答案</button><button class="secondary hide" id="next">下一題 →</button></div><div class="feedback" id="feedback" aria-live="polite"></div></div><div class="summary hide" id="summary"></div><p class="footer">母音字母採 a／e／i／o／u，其餘視為子音字母（包含 y）。不完整的答案不計錯誤次數；答錯兩次顯示答案，並列入本輪錯題。完成一輪後只重練答錯的單字，直到該輪全部一次答對。發音使用 Chrome／Edge 的美式英語語音合成，需裝置具備語音功能。</p></section></main><script>
"use strict";
const WORDS=[["freedom", "n.", "自由"], ["pour", "v.", "湧入；傾瀉；倒（水、茶等）"], ["curious", "adj.", "好奇的"], ["curiosity", "n.", "好奇心"], ["urge", "v.", "竭力主張"], ["political", "adj.", "政治的；政治上的"], ["politics", "n.", "政治；政治活動"], ["politician", "n.", "政治人物；從政者"], ["march", "n. / v.", "示威遊行；行進"], ["justice", "n.", "公平；正義"], ["numerous", "adj.", "許多的；很多的"], ["shock", "v. / n.", "使震驚；震驚"], ["consciousness", "n.", "意識；感覺"], ["conscious", "adj.", "意識到的；感覺到的；神智清醒的"], ["establish", "v.", "建立；設立"], ["establishment", "n.", "建立；設立；企業；機構"], ["harsh", "adj.", "嚴苛的；殘酷的；嚴峻的"], ["strict", "adj.", "嚴格的"], ["campaign", "n. / v.", "運動；活動；發起活動"], ["active", "adj.", "活躍的"], ["democracy", "n.", "民主；民主制度"], ["democratic", "adj.", "民主的"], ["pioneer", "n. / v.", "先驅；先鋒；引領；開拓"], ["cure", "v. / n.", "治癒；治好；療法；治療"], ["promote", "v.", "推動；促進；晉升；升遷"], ["promotion", "n.", "（職位等）晉升；升遷"], ["appeal", "n. / v.", "訴求；呼籲；懇求"], ["skillful", "adj.", "有技巧的；熟練的"], ["contest", "n. / v.", "競賽；比賽；競爭；角逐"], ["celebration", "n.", "慶祝會"], ["despite", "prep.", "儘管；即使"], ["generous", "adj.", "充足的；大的；慷慨的；大方的"]];
const $=id=>document.getElementById(id);
let part=0,mode=1,queue=[],index=0,round=1,wrongSet=new Set(),errors=0,done=false,active=false;
const fields=()=>Array.from($('tiles').querySelectorAll('input'));
const isHidden=ch=>mode===3||(mode===1?'aeiou'.includes(ch):!'aeiou'.includes(ch));
function message(s,color='#20364c'){$('feedback').textContent=s;$('feedback').style.color=color}
function select(which,value){if(active)return;if(which==='part')part=value;else mode=value;document.querySelectorAll('[data-'+which+']').forEach(b=>b.classList.toggle('active',Number(b.dataset[which])===value));$('summary').classList.add('hide');$('status').textContent='已選擇：第'+(part+1)+'部分， 第'+mode+'關。按「開始練習」。'}
document.querySelectorAll('[data-part]').forEach(b=>b.addEventListener('click',()=>select('part',Number(b.dataset.part))));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>select('mode',Number(b.dataset.mode))));
function lockSelectors(locked){document.querySelectorAll('.pill').forEach(b=>{b.disabled=locked;b.style.opacity=locked?'.55':'1'})}
function start(){active=true;round=1;queue=WORDS.slice(part*16,part*16+16).map((_,i)=>part*16+i);index=0;wrongSet.clear();lockSelectors(true);$('summary').classList.add('hide');$('startarea').classList.add('hide');$('quiz').classList.remove('hide');showQuestion()}
function showQuestion(){done=false;errors=0;const w=WORDS[queue[index]];$('counter').textContent='第 '+(index+1)+' / '+queue.length+' 題';$('round').textContent=round===1?'第一輪':'錯題複習｜第 '+round+' 輪';$('status').textContent='第 '+(part+1)+' 部分｜第 '+mode+' 關｜本輪錯題 '+wrongSet.size+' 字';$('meaning').textContent=w[1]+' '+w[2];$('check').classList.remove('hide');$('next').classList.add('hide');$('tiles').replaceChildren();for(let i=0;i<w[0].length;i++){const ch=w[0][i],tile=document.createElement('div');tile.className='tile';if(isHidden(ch)){const inp=document.createElement('input');inp.type='text';inp.maxLength=1;inp.autocapitalize='off';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('data-answer',ch);inp.setAttribute('aria-label','第 '+(i+1)+' 個字母');inp.addEventListener('input',()=>{fields().forEach(el=>el.style.background='#fff9e9');message('請填滿所有空格後按「檢查答案」。')});inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')check()});tile.appendChild(inp)}else tile.textContent=ch;$('tiles').appendChild(tile)}message('請完成所有空格。');const first=$('tiles').querySelector('input');if(first)first.focus()}
function speak(){if(!('speechSynthesis'in window)){message('此瀏覽器不支援語音播放。','#a33535');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(WORDS[queue[index]][0]);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function check(){if(done)return;const f=fields();if(f.some(x=>!x.value.trim())){message('請先填滿所有空格，再檢查答案。','#a46c12');return}const wrong=f.filter(x=>x.value.normalize('NFKC').trim().toLowerCase()!==x.getAttribute('data-answer'));f.forEach(x=>x.style.background=wrong.includes(x)?'#ffe9e9':'#e3f4e9');if(!wrong.length){done=true;f.forEach(x=>x.disabled=true);message('✅ 正確！'+WORDS[queue[index]][0], '#207043');$('check').classList.add('hide');$('next').classList.remove('hide');return}errors++;wrongSet.add(queue[index]);$('status').textContent='第 '+(part+1)+' 部分｜第 '+mode+' 關｜本輪錯題 '+wrongSet.size+' 字';if(errors>=2){done=true;f.forEach(x=>{x.value=x.getAttribute('data-answer');x.disabled=true;x.style.background='#e3f4e9'});message('已答錯兩次。正確答案：'+WORDS[queue[index]][0]+'。本題將在本輪結束後重新練習。','#a33535');$('check').classList.add('hide');$('next').classList.remove('hide')}else message('❌ 有 '+wrong.length+' 個字母不正確，請修改紅色空格再試一次。','#a33535')}
function next(){if(!done)return;index++;if(index<queue.length){showQuestion();return}if(wrongSet.size){queue=Array.from(wrongSet);wrongSet.clear();index=0;round++;showQuestion();return}active=false;lockSelectors(false);$('quiz').classList.add('hide');$('summary').classList.remove('hide');$('summary').replaceChildren();const h=document.createElement('h2');h.textContent='🎉 本部分第 '+mode+' 關完成！';const p=document.createElement('p');p.textContent='16 個單字已全部通過（包含錯題複習）。';const b=document.createElement('button');b.className='main';b.textContent='重新練習這一關';b.addEventListener('click',start);$('summary').append(h,p,b);$('startarea').classList.remove('hide');$('status').textContent='練習完成！可切換部分或關卡繼續練習。'}
$('start').addEventListener('click',start);$('speak').addEventListener('click',speak);$('check').addEventListener('click',check);$('next').addEventListener('click',next);
</script></body></html>
