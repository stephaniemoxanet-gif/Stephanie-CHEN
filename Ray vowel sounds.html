<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D生 Phonics 七單元二關練習</title><style>
:root{font-family:Arial,'Noto Sans TC',sans-serif;background:#f4f7fc;color:#24344d}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:18px}h1{margin:10px 0;color:#294f92}.intro{color:#52617b;line-height:1.6}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.unit{background:#e7edfa;border:2px solid #c9d6ef;color:#294e8e;text-align:left;padding:13px;border-radius:14px;cursor:pointer;font-size:17px;font-weight:bold}.unit.active{background:#315fbd;color:#fff}.unit small{display:block;font-size:12px;margin-top:5px;font-weight:normal}.panel{background:#fff;border-radius:22px;padding:24px;box-shadow:0 5px 20px #1a376012}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.level{font-weight:bold;color:#315fbd}.meter{height:10px;background:#e4ebf7;border-radius:8px;overflow:hidden;margin:14px 0}.meter>div{height:100%;background:#55b19b;transition:width .2s}.listen{background:#fbd36b;color:#503d05;border:0;border-radius:16px;padding:18px 25px;font-size:24px;font-weight:bold;cursor:pointer;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0}.choice{border:2px solid #a6bce7;border-radius:15px;background:#f0f5ff;min-height:74px;font-size:29px;font-weight:bold;color:#234c91;cursor:pointer}.choice.wrong{background:#ffe0e0;border-color:#d66}.choice.correct{background:#d7f5e7;border-color:#29a76b}.choice:disabled{opacity:.7;cursor:default}.type{font-size:28px;padding:13px;width:100%;max-width:380px;border:2px solid #a5b7d9;border-radius:13px;text-align:center}.primary{border:0;background:#315fbd;color:#fff;border-radius:12px;padding:13px 21px;font-size:18px;font-weight:bold;cursor:pointer;margin:7px}.primary:disabled{background:#aab8d3}.compare{border:1px solid #dbb858;background:#fff1c9;border-radius:10px;padding:10px;font-size:17px;cursor:pointer;margin:5px}.feedback{font-weight:bold;font-size:19px;min-height:29px;margin:12px 0}.hint{font-size:14px;color:#65738c}.summary{background:#f1f6ff;border-radius:14px;padding:15px;line-height:1.7}.summary table{border-collapse:collapse;width:100%}.summary th,.summary td{padding:7px;border-bottom:1px solid #d7e2f4;text-align:left}.hidden{display:none}.notice{background:#fff7e4;border-radius:12px;padding:12px;color:#735716;font-size:14px;line-height:1.6;margin-top:16px}@media(max-width:640px){.units{grid-template-columns:repeat(2,1fr)}.panel{padding:15px}.choice{font-size:24px}}
</style></head><body><main class="wrap"><h1>🔊 D生 Phonics 聽音辨字</h1><div class="intro">七個單元各 <b>10 題</b>，分成兩關：① 二選一（5題） → ② 四選一（5題）；全程點選答案，不需打字。答錯可點選選項發音比較；記錄各單元首次答對率，方便老師找出弱項。</div><div class="units" id="units"></div><section class="panel" id="panel"></section><div class="notice">⚠️ 使用瀏覽器內建英文語音。請先試聽，特別是 <b>dam/dame、ban/bane、dun/dune、met/mete</b> 等低頻詞；若裝置讀音不正確，該題不適合用來判斷辨音能力。e_e 的真實單字較少，部分題目不是最小對立詞（如 bed/these）；請以聽辨短 /ɛ/ 與長 /iː/ 為主。建議 Chrome／Edge，先點一次「聽題目」啟動語音。</div></main><script>
const units=[
 {name:'am vs ame',pairs:[['Sam','same'],['dam','dame'],['sham','shame'],['lam','lame'],['Sam','same']]},
 {name:'an vs ane',pairs:[['can','cane'],['pan','pane'],['man','mane'],['van','vane'],['ban','bane']]},
 {name:'a vs a_e',pairs:[['at','ate'],['hat','hate'],['mat','mate'],['fat','fate'],['mad','made']]},
 {name:'o vs o_e',pairs:[['hop','hope'],['not','note'],['rob','robe'],['cod','code'],['cop','cope']]},
 {name:'i vs i_e',pairs:[['kit','kite'],['bit','bite'],['hid','hide'],['rid','ride'],['pin','pine']]},
 {name:'u vs u_e',pairs:[['cub','cube'],['cut','cute'],['tub','tube'],['dun','dune'],['tun','tune']]},
 {name:'e vs e_e',pairs:[['pet','Pete'],['met','mete'],['bed','these'],['pen','theme'],['red','scene']]}
];
// Each unit has ten targets: five short-vowel and five long-vowel words, interleaved across three levels.
const state=units.map(()=>({index:0,first:0,errors:[],complete:false}));let ui=0,locked=false,wrong=false;
function allWords(u){return units[u].pairs.flat()}
function targets(u){let p=units[u].pairs;return [p[0][0],p[1][1],p[2][0],p[3][1],p[4][0],p[0][1],p[1][0],p[2][1],p[3][0],p[4][1]]}
function voice(s){if(!window.speechSynthesis){alert('瀏覽器不支援朗讀');return;}speechSynthesis.cancel();const v=new SpeechSynthesisUtterance(s);v.lang='en-US';v.rate=.76;const list=speechSynthesis.getVoices();v.voice=list.find(x=>x.lang==='en-US'&&/Google|Microsoft|Samantha|Jenny/i.test(x.name))||list.find(x=>x.lang.startsWith('en'))||null;speechSynthesis.speak(v)}
function norm(s){return s.trim().toLowerCase()}
function renderTabs(){document.getElementById('units').innerHTML=units.map((u,i)=>`<button class="unit ${ui===i?'active':''}" data-u="${i}">${i+1}. ${u.name}<small>${state[i].complete?'完成 '+state[i].first+'/10':'已完成 '+state[i].index+'/10'}</small></button>`).join('');document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ui=+b.dataset.u;render()})}
function getOptions(u,target,level){const pair=units[u].pairs.find(p=>p.includes(target));if(level===1)return pair.slice();const pool=allWords(u).filter(w=>norm(w)!==norm(target)&&!pair.includes(w));const opts=[...pair,pool[(state[u].index*3)%pool.length],pool[(state[u].index*3+3)%pool.length]];return [...new Set(opts)].slice(0,4)}
function shuffleFixed(arr,seed){const a=[...arr];for(let i=a.length-1;i>0;i--){let j=(seed*7+i*3)% (i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){renderTabs();const s=state[ui],p=document.getElementById('panel');if(s.complete){p.innerHTML=`<h2>🎉 ${units[ui].name} 完成！</h2><div class="summary"><b>首次答對：${s.first} / 10（${s.first*10}%）</b><p>首次答錯的題目：${s.errors.length?s.errors.join('、'):'無'}</p></div><button class="primary" id="redo">🔄 重練本單元</button><button class="primary" id="overview">📊 查看七單元統計</button><div id="stats"></div>`;document.getElementById('redo').onclick=()=>{state[ui]={index:0,first:0,errors:[],complete:false};render()};document.getElementById('overview').onclick=showStats;return}
const q=s.index,level=q<5?1:2,target=targets(ui)[q];locked=false;wrong=false;
p.innerHTML=`<div class="top"><span class="level">第 ${level} 關｜${['','二選一辨音','四選一辨音'][level]}</span><span>第 ${q+1} / 10 題</span></div><div class="meter"><div style="width:${q*10}%"></div></div><div style="text-align:center"><button class="listen" id="listen">🔊 聽題目發音</button><p class="hint">聽音後點選正確拼字</p><div id="task"></div><div class="feedback" id="feedback" aria-live="polite"></div><div id="compare" class="hidden"></div><button class="primary" id="next" disabled>${q===9?'完成本單元':'下一題 →'}</button></div>`;
document.getElementById('listen').onclick=()=>voice(target);const task=document.getElementById('task');{let opts=shuffleFixed(getOptions(ui,target,level),q+ui);task.innerHTML='<div class="choices">'+opts.map((w,i)=>`<button class="choice" data-word="${w}" id="ch${i}">${w}</button>`).join('')+'</div>';task.querySelectorAll('.choice').forEach(b=>b.onclick=()=>check(b.dataset.word,b));}
document.getElementById('next').onclick=()=>{s.index++;if(s.index>=10)s.complete=true;render()};
function check(value,btn){if(locked)return;const good=norm(value)===norm(target);const fb=document.getElementById('feedback'),cmp=document.getElementById('compare');if(good){locked=true;if(!wrong)s.first++;fb.textContent=wrong?'✅ 訂正成功！':'✅ 首次答對！';fb.style.color='#168253';if(btn)btn.classList.add('correct');task.querySelectorAll('.choice').forEach(x=>x.disabled=true);document.getElementById('next').disabled=false;voice(target)}else{if(!wrong){s.errors.push(target);wrong=true;}fb.textContent='❌ 再聽一次，點選下面的發音比較後重新作答。';fb.style.color='#b84b38';if(btn){btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),650)}let pair=units[ui].pairs.find(x=>x.includes(target));cmp.classList.remove('hidden');cmp.innerHTML='<p class="hint">點擊比較兩種讀音：</p>'+pair.map((w,i)=>`<button class="compare" data-sound="${w}">🔊 ${w}</button>`).join('');cmp.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>voice(b.dataset.sound));voice(target)}}
}
function showStats(){const out=document.getElementById('stats');out.innerHTML='<div class="summary"><h3>各單元掌握情況（首次答對）</h3><table><tr><th>單元</th><th>正確率</th><th>首次錯誤</th></tr>'+units.map((u,i)=>`<tr><td>${u.name}</td><td>${state[i].complete?state[i].first+'/10':'未完成'}</td><td>${state[i].errors.join('、')||'—'}</td></tr>`).join('')+'</table><p class="hint">統計僅保存在目前開啟的頁面，重新整理後會歸零；可截圖提供老師。</p></div>'}
render();
</script></body></html>
