const FEEL=['angry','sleepy','hungry','cold','hot','full','bored'];
const FOODS=['apple','kiwi','banana','hamburger','pizza','small cake','orange'];
const ANIMALS=['rabbit','goat','monkey','dog','cat','horse','pig'];
const EMOJI={rabbit:'🐰',goat:'🐐',monkey:'🐵',dog:'🐶',cat:'🐱',horse:'🐴',pig:'🐷'};
const PAIRS=[['rabbit','carrot'],['goat','apple'],['monkey','banana'],['dog','orange'],['cat','kiwi'],['horse','carrot'],['pig','kiwi']];
const FRUITS=['apple','banana','kiwi','orange','carrot'];
const FRUIT_EMOJI={apple:'🍎',banana:'🍌',kiwi:'🥝',orange:'🍊',carrot:'🥕'};
const extraFood={carrot:'🥕',fish:'🐟'};
let unit='feel',questions=[],index=0,step=0,selection={},wrong=false,done=false,score=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function article(s){return /^[aeiou]/.test(s)?'an':'a'}
function buildQuestions(u){if(u==='feel')return shuffle(FEEL).map(x=>({kind:'feel',value:x}));return [...shuffle(FOODS).map(x=>({kind:'food',value:x})),...shuffle(PAIRS).map(([animal,food])=>({kind:'pair',animal,food}))]}
function start(u){speechSynthesis.cancel();unit=u;questions=buildQuestions(u);index=0;step=0;selection={};wrong=false;done=false;score=0;document.getElementById('navFeel').classList.toggle('active',u==='feel');document.getElementById('navEat').classList.toggle('active',u==='eat');render()}
function qtext(q){if(q.kind==='feel')return `How do you feel? I feel ${q.value}.`;if(q.kind==='food')return `What do you eat? I eat ${article(q.value)} ${q.value}.`;return `What does the ${q.animal} eat? The ${q.animal} eats ${article(q.food)} ${q.food}.`}
function speak(text){speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(text);a.lang='en-US';a.rate=.78;a.pitch=1;let voices=speechSynthesis.getVoices();let us=voices.find(v=>v.lang==='en-US'&&/Google|Microsoft|Samantha|Natural/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(us)a.voice=us;speechSynthesis.speak(a)}
function speakCurrent(){if(done)return;const q=questions[index];speak(qtext(q))}
function speakCorrect(){let q=questions[index];speak(qtext(q))}
function card(label,type,chosen,correct){let b=document.createElement('button');b.className='choice';b.type='button';if(chosen===label)b.classList.add('selected');if(correct===label)b.classList.add('correct');let img=type==='feel'?IMG.feel[label]:IMG.food[label];if(type==='animal'||type==='fruit'||extraFood[label]){let em=document.createElement('div');em.className='emoji';em.textContent=type==='animal'?EMOJI[label]:type==='fruit'?FRUIT_EMOJI[label]:extraFood[label];b.append(em)}else if(img){let im=document.createElement('img');im.src=img;im.alt='選項圖片';b.append(im)}b.setAttribute('aria-label','選擇圖片 '+label);b.onclick=()=>choose(label);return b}
function render(){let g=document.getElementById('grid'),st=document.getElementById('status'),q=questions[index];g.innerHTML='';st.textContent='';st.className='status';document.getElementById('answerAudio').classList.remove('show');document.getElementById('next').classList.add('hidden');document.getElementById('sentence').textContent='先聽題目，再選圖片。';document.getElementById('progress').textContent=`${unit==='feel'?'單元一：情緒':'單元二：食物與動物'}｜第 ${index+1} / ${questions.length} 題｜答對 ${score} 題`;
 if(!q){finish();return}let stage=q.kind==='pair'?(step===0?'第一步：選出聽到的動物':'第二步：選出聽到的食物'):'選出聽到的圖片';document.getElementById('stage').textContent=stage;document.getElementById('question').textContent=q.kind==='feel'?'How do you feel?':q.kind==='food'?'What do you eat?':`What does the ______ eat?`;
 let type=q.kind==='feel'?'feel':q.kind==='food'?'food':step===0?'animal':'fruit';let labels=q.kind==='feel'?FEEL:q.kind==='food'?FOODS:step===0?ANIMALS:FRUITS;shuffle(labels).forEach(x=>g.append(card(x,type,null,null)))}
function choose(label){if(done)return;let q=questions[index],correct=q.kind==='feel'?q.value:q.kind==='food'?q.value:step===0?q.animal:q.food;let st=document.getElementById('status');if(label!==correct){wrong=true;st.textContent='再聽一次，重新選擇！';st.className='status bad';document.getElementById('answerAudio').classList.add('show');let btn=[...document.querySelectorAll('.choice')].find(b=>b.getAttribute('aria-label')==='選擇圖片 '+label);if(btn){btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),700)}speakCurrent();return}
 if(q.kind==='pair'&&step===0){selection.animal=label;step=1;st.textContent='動物答對了！接著選食物。';st.className='status good';let g=document.getElementById('grid');g.innerHTML='';shuffle(FRUITS).forEach(x=>g.append(card(x,'fruit',null,null)));document.getElementById('stage').textContent='第二步：選出聽到的食物';speakCurrent();return}
 if(!wrong)score++;done=true;st.textContent='✅ 答對了！';st.className='status good';document.getElementById('sentence').textContent=qtext(q);document.getElementById('next').classList.remove('hidden');document.getElementById('answerAudio').classList.add('show');let btn=[...document.querySelectorAll('.choice')].find(b=>b.getAttribute('aria-label')==='選擇圖片 '+label);if(btn)btn.classList.add('correct');speakCorrect()}
function next(){index++;step=0;wrong=false;done=false;selection={};if(index>=questions.length)finish();else render()}
function finish(){speechSynthesis.cancel();document.getElementById('grid').innerHTML='';document.getElementById('progress').textContent='練習完成';document.getElementById('stage').textContent='🎉 Great job!';document.getElementById('question').textContent=`本單元完成 ${questions.length} 題，第一次就答對 ${score} 題！`;document.getElementById('sentence').textContent='可以再練習一次，或切換到另一個單元。';document.getElementById('status').textContent='';document.getElementById('next').classList.add('hidden');document.getElementById('answerAudio').classList.remove('show');done=true}
start('feel');
</script></body></html>
